
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b19">
<title>У меня к тебе вопрос 💘</title>

<style>
:root {
  --pink: #ff4fa0;
  --purple: #9d65ff;
  --white: #fff7fc;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

body {
  min-height: 100svh;
  overflow: hidden;
  color: var(--white);
  background: #100b19;
}

.bg {
  position: fixed;
  inset: -20%;
  background:
    radial-gradient(ellipse at 18% 25%, #ff3e9d45, transparent 35%),
    radial-gradient(ellipse at 82% 72%, #7848ff50, transparent 38%);
  filter: blur(20px);
  animation: bgmove 12s ease-in-out infinite alternate;
  pointer-events: none;
}

.app {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 20px 16px;
}

.top {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  color: #ffffffa8;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.card {
  width: min(100%, 430px);
  text-align: center;
  padding: clamp(24px, 6vh, 44px) 22px 28px;
  border: 1px solid #ffffff24;
  border-radius: 30px;
  background: linear-gradient(145deg, #ffffff12, #ffffff05);
  box-shadow: 0 30px 100px #0007;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: enter .7s ease both;
}

.eyebrow {
  display: inline-block;
  padding: 8px 13px;
  border: 1px solid #ff80bd50;
  border-radius: 30px;
  background: #ff4fa016;
  color: #ffc4df;
  font-size: 11px;
  letter-spacing: 1px;
}

.heart-wrap {
  height: 130px;
  display: grid;
  place-items: center;
  position: relative;
  margin: 12px 0;
}

.ring {
  position: absolute;
  width: 110px;
  height: 110px;
  border: 1px solid #ff73b34c;
  border-radius: 50%;
  animation: ring 3s ease-out infinite;
}

.ring:nth-child(2) {
  animation-delay: 1s;
}

.ring:nth-child(3) {
  animation-delay: 2s;
}

.bigheart {
  z-index: 1;
  font-size: 78px;
  filter: drop-shadow(0 0 22px #ff398b88);
  animation: heartbeat 1.4s infinite;
}

h1 {
  margin: 12px 0;
  font-size: clamp(34px, 9vw, 48px);
  line-height: 1.05;
  letter-spacing: -1.5px;
  font-weight: 850;
}

h1 span {
  color: #ff69b4;
  background: linear-gradient(90deg, #ff9dc9, #ff4fa0, #c3a1ff);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  max-width: 310px;
  margin: 0 auto 26px;
  color: #d6c8dc;
  font-size: 15px;
  line-height: 1.65;
}

.buttons {
  min-height: 62px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#yes {
  position: relative;
  z-index: 2;
  padding: 17px 25px;
  border-radius: 17px;
  color: white;
  background: linear-gradient(110deg, #ff4f9e, #ff6b88, #a76bff);
  box-shadow: 0 9px 30px #ff4fa04d;
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  transition: transform .2s, filter .2s;
}

#no {
  position: relative;
  z-index: 30;
  padding: 14px 19px;
  border: 1px solid #ffffff28;
  border-radius: 16px;
  color: #eee0f1;
  background: #ffffff0b;
  font-size: 15px;
  font-weight: 650;
  white-space: nowrap;
}

#result {
  display: none;
  margin-top: 24px;
  color: #ff8ec6;
  font-size: 24px;
  font-weight: 850;
}

#result.show {
  display: block;
  animation: pop .4s ease;
}

#hint {
  min-height: 18px;
  margin-top: 20px;
  color: #b9a7c2;
  font-size: 12px;
}

.bottom {
  position: absolute;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  text-align: center;
  color: #ffffff60;
  font-size: 10px;
  letter-spacing: 2px;
}

.float {
  position: fixed;
  bottom: -40px;
  z-index: 40;
  pointer-events: none;
  animation: floatup linear forwards;
}

.toast {
  position: fixed;
  top: max(55px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  padding: 11px 16px;
  border: 1px solid #ffffff25;
  border-radius: 30px;
  background: #24162f;
  font-size: 13px;
  white-space: nowrap;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  12% { transform: scale(1.13); }
  24% { transform: scale(1); }
  36% { transform: scale(1.06); }
}

@keyframes ring {
  0% { transform: scale(.7); opacity: 0; }
  25% { opacity: .7; }
  100% { transform: scale(1.6); opacity: 0; }
}

@keyframes enter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes floatup {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translateY(-115svh) rotate(35deg); opacity: 0; }
}

@keyframes bgmove {
  to { transform: translate(4%, 3%) scale(1.08); }
}

@media (max-height: 700px) {
  .card { padding-top: 18px; padding-bottom: 18px; }
  .heart-wrap { height: 90px; }
  .bigheart { font-size: 60px; }
  .ring { width: 85px; height: 85px; }
  h1 { font-size: 34px; }
  .subtitle { margin-bottom: 16px; }
  #hint { margin-top: 12px; }
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="app">
  <div class="top">
    <span>💌 вопросик</span>
    <span>✦ только для тебя</span>
  </div>

  <main class="card">
    <div class="eyebrow">✦ СЕКРЕТНОЕ ПРИЗНАНИЕ ✦</div>

    <div class="heart-wrap" aria-hidden="true">
      <i class="ring"></i>
      <i class="ring"></i>
      <i class="ring"></i>
      <div class="bigheart">💗</div>
    </div>

    <h1>У меня к тебе<br><span>вопрос…</span></h1>

    <p class="subtitle">
      Кажется, ты мне нравишься больше,
      чем я планировал(а). Может, попробуем быть вместе? 🥹
    </p>

    <div class="buttons" id="buttons">
      <button id="yes" type="button">ДА, ДАВАЙ 💘</button>
      <button id="no" type="button">Нет 🙈</button>
    </div>

    <div id="result">ЭТО ЛУЧШИЙ ДЕНЬ 💖</div>
    <p id="hint">выбери свой ответ · я не подглядываю 👀</p>
  </main>

  <div class="bottom">made with a little love · ♡</div>
</div>

<script>
const no = document.querySelector('#no');
const yes = document.querySelector('#yes');
const hint = document.querySelector('#hint');

let noCount = 0;
let yesScale = 1;
let won = false;
let moving = false;

function toast(message) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function runAway() {
  if (won || moving) return;
  moving = true;
  noCount++;

  /*
    Ключевое исправление:
    переносим кнопку напрямую в body, чтобы transform карточки
    не влиял на fixed-позиционирование кнопки.
  */
  if (no.parentElement !== document.body) {
    document.body.appendChild(no);
  }

  no.style.position = 'fixed';
  no.style.zIndex = '30';

  const margin = 12;
  const width = no.offsetWidth;
  const height = no.offsetHeight;

  const maxX = Math.max(margin, window.innerWidth - width - margin);
  const maxY = Math.max(margin, window.innerHeight - height - margin);

  const x = margin + Math.random() * Math.max(0, maxX - margin);
  const y = margin + Math.random() * Math.max(0, maxY - margin);

  no.style.left = Math.round(x) + 'px';
  no.style.top = Math.round(y) + 'px';

  yesScale = Math.min(1.5, yesScale + 0.06);
  yes.style.transform = `scale(${yesScale})`;

  const messages = [
    'Ой, кнопка испугалась 😭',
    'Кажется, это знак 👀',
    'Ну пожааалуйста 🥺',
    'Кнопка «Да» ждёт тебя 💗',
    'Так близко и так далеко 😂'
  ];

  hint.textContent = messages[Math.min(noCount - 1, messages.length - 1)];

  if (noCount === 3) toast('Кнопка «Да» скучает 💞');
  if (noCount === 6) toast('Кажется, это судьба 😭💗');

  createHearts(3);

  setTimeout(() => { moving = false; }, 180);
}

/* На компьютере кнопка убегает ещё до клика. */
no.addEventListener('pointerenter', event => {
  if (event.pointerType === 'mouse') runAway();
});

/* На телефоне убегает при касании. */
no.addEventListener('touchstart', event => {
  event.preventDefault();
  runAway();
}, { passive: false });

/* Запасной вариант для клика мышью/клавиатурой. */
no.addEventListener('click', event => {
  event.preventDefault();
  runAway();
});

function createHearts(count) {
  const emojis = ['💗', '💕', '✨', '💘', '💖'];

  for (let i = 0; i < count; i++) {
    const heart = document.createElement('span');
    heart.className = 'float';
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    heart.style.left = (Math.random() * 94 + 2) + 'vw';
    heart.style.fontSize = (18 + Math.random() * 22) + 'px';
    heart.style.animationDuration = (3 + Math.random() * 2) + 's';

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5200);
  }
}

yes.addEventListener('click', () => {
  if (won) return;
  won = true;

  document.querySelector('#result').classList.add('show');
  document.querySelector('#buttons').style.display = 'none';
  no.style.display = 'none';

  hint.textContent = 'официально: теперь есть повод улыбаться 💌';

  createHearts(45);
  toast('Ответ принят 💖');
});

/* При повороте телефона удерживаем кнопку в пределах экрана. */
window.addEventListener('resize', () => {
  if (no.parentElement === document.body && no.style.display !== 'none') {
    const margin = 12;
    const maxX = Math.max(margin, innerWidth - no.offsetWidth - margin);
    const maxY = Math.max(margin, innerHeight - no.offsetHeight - margin);

    no.style.left = Math.min(parseFloat(no.style.left) || margin, maxX) + 'px';
    no.style.top = Math.min(parseFloat(no.style.top) || margin, maxY) + 'px';
  }
});
</script>
</body>
</html>
